<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-cockpit</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a21; --panel2:#1c212a; --line:#252b36;
    --fg:#e6e9ef; --muted:#8b94a6; --accent:#d97757; --ok:#4ea87a;
    --warn:#d9a441; --crit:#d95757; --blue:#5b8dd9;
    --radius:14px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --panel:#fff; --panel2:#f0f2f5; --line:#e2e5ea;
           --fg:#1a1d23; --muted:#69707e; }
  }
  *{box-sizing:border-box}
  /* a card body carrying its own display: (.rows is a flex column) would beat
     the user-agent rule and stay on screen while marked hidden */
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:19px;margin:0;letter-spacing:-.2px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px}
  .meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;
        padding:3px 11px;font-size:12px;color:var(--muted)}
  .pill b{color:var(--fg);font-weight:600}
  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1.35fr 1fr;align-items:start}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:900px){.g3,.g2,.g4{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
           margin:0 0 12px;font-weight:600}
  .gauge{display:flex;align-items:center;gap:16px}
  .gauge .num{font-size:26px;font-weight:650;letter-spacing:-.5px}
  .gauge .cap{color:var(--muted);font-size:12.5px;margin-top:2px}
  .kpi .v{font-size:22px;font-weight:650;letter-spacing:-.4px}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;
     text-transform:uppercase;letter-spacing:.6px;padding:0 8px 8px 0}
  td{padding:7px 8px 7px 0;border-top:1px solid var(--line);vertical-align:middle}
  td.r,th.r{text-align:right}
  .bar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px}
  .muted{color:var(--muted)}
  .tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--panel2);color:var(--muted)}
  .rows{display:flex;flex-direction:column;gap:10px}
  .sess{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--panel2);
        border-radius:10px;border:1px solid transparent}
  .sess.busy{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
  .sess .nm{font-weight:600}
  .sess .pth{font-size:12px;color:var(--muted);word-break:break-all}
  .right{margin-left:auto;text-align:right;white-space:nowrap}
  .cmd{appearance:none;background:var(--panel);border:1px solid var(--line);color:var(--muted);
       font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 7px;
       border-radius:6px;margin-top:6px;cursor:pointer;max-width:100%;
       text-align:left;word-break:break-all}
  .cmd:hover{color:var(--fg);border-color:var(--accent)}
  svg{display:block;overflow:visible}
  .lbl{fill:var(--muted);font-size:9.5px}
  footer{margin-top:26px;color:var(--muted);font-size:12px;text-align:center}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--line);
        padding-bottom:0}
  .tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
        color:var(--muted);font:inherit;font-size:13px;padding:8px 13px 9px;cursor:pointer;
        border-radius:8px 8px 0 0;margin-bottom:-1px}
  .tabs button:hover{color:var(--fg);background:var(--panel)}
  .tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
  .tabs button .miss{color:var(--crit);margin-left:6px;font-size:11px}
  .split{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .mini{display:flex;align-items:center;gap:12px;background:var(--panel2);
        border-radius:10px;padding:10px 12px}
  .mini .who{font-weight:600;font-size:13px}
  .mini .amt{font-size:12.5px;color:var(--muted);margin-top:2px}
  .note{color:var(--muted);font-size:12.5px;margin-top:10px}
  .scope{float:right;font-weight:400;text-transform:none;letter-spacing:0}
  .scope button{appearance:none;background:none;border:0;color:var(--muted);
        font:inherit;font-size:11px;cursor:pointer;padding:0 5px;border-radius:5px}
  .scope button[aria-pressed="true"]{color:var(--fg);background:var(--panel2)}
  .heat{display:grid;grid-template-columns:auto repeat(24,1fr);gap:2px;align-items:center}
  .heat i{display:block;height:14px;border-radius:3px;background:var(--accent)}
  .heat .lbl-y{font-size:10.5px;color:var(--muted);padding-right:6px;text-align:right}
  .heat .lbl-x{font-size:9.5px;color:var(--muted);text-align:center}
  .delta{font-size:12px;margin-top:3px}
  h2.fold{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
  h2.fold:hover{color:var(--fg)}
  h2.fold .chev{font-size:9px;line-height:1;transition:transform .15s ease}
  h2.fold[aria-expanded="true"] .chev{transform:rotate(90deg)}
  h2.fold[aria-expanded="false"]{margin-bottom:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>cc<span>·</span>cockpit</h1>
    <span class="pill" id="plan">—</span>
    <span class="pill" id="live">—</span>
    <span class="pill" id="login" hidden></span>
    <div class="meta">
      <span class="sub" id="upd"></span>
      <span class="sub mono" id="ver"></span>
    </div>
  </header>

  <div class="tabs" id="tabs" role="tablist" hidden></div>

  <div class="grid g3" id="gauges"></div>

  <div class="grid g4" style="margin-top:14px" id="kpis"></div>

  <div class="card" style="margin-top:14px">
    <h2 data-fold="official"><span data-t="card_official"></span></h2>
    <div id="official"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2 data-t="card_daily"></h2>
    <div id="daily"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2 data-fold="heatmap"><span data-t="card_heatmap"></span>
      <span class="muted" id="heat-note"></span></h2>
    <div id="heatmap"></div>
  </div>

  <div class="grid g2" style="margin-top:14px">
    <div class="card">
      <h2 data-t="card_hourly"></h2>
      <div id="hourly"></div>
    </div>
    <div class="card">
      <h2 data-t="card_sessions"></h2>
      <div class="rows" id="sessions"></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px" id="recent-card">
    <h2 data-fold="recent" data-fold-default="closed">
      <span data-t="recent_sessions"></span>
      <span class="muted" id="recent-note"></span></h2>
    <div class="rows" id="recent"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2><span data-t="card_projects"></span>
      <span class="scope" id="proj-scope"></span></h2>
    <table id="projects"></table>
  </div>

  <div class="card" style="margin-top:14px">
    <h2 id="h-blocks"></h2>
    <div id="blocks"></div>
  </div>

  <div class="grid g3" style="margin-top:14px">
    <div class="card"><h2 data-t="card_models"></h2><table id="models"></table></div>
    <div class="card"><h2 data-t="card_tokenmix"></h2><div id="tokmix"></div></div>
    <div class="card"><h2 data-t="card_effort"></h2><div id="misc"></div></div>
  </div>

  <footer id="foot"></footer>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LOCALE = 'en-US', T = {}, LOCAL = null;
const t = (k, p={}) => (T[k]||k).replace(/\{(\w+)\}/g, (_,n) => p[n] ?? '');
const nf = () => new Intl.NumberFormat(LOCALE);
// 'symbol' over 'narrowSymbol': outside en-US the narrow form is a bare $,
// which reads as the local currency rather than USD
const money = v => new Intl.NumberFormat(LOCALE,
  {style:'currency', currency:'USD', currencyDisplay:'symbol'}).format(v);
const local = v => LOCAL
  ? ' · ' + LOCAL.symbol + ' ' + (v*LOCAL.rate).toLocaleString(LOCALE,{maximumFractionDigits:0})
  : '';
function toks(n){
  const f = (x,d) => x.toLocaleString(LOCALE,{minimumFractionDigits:d,maximumFractionDigits:d});
  if(n>=1e9) return f(n/1e9,2)+'B';
  if(n>=1e6) return f(n/1e6,1)+'M';
  if(n>=1e3) return f(n/1e3,0)+'k';
  return String(n);
}
function dur(s){
  s = Math.max(0, Math.round(s));
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(d) return d+'d '+h+'h';
  if(h) return h+'h '+String(m).padStart(2,'0')+'m';
  return m+'m';
}
// Folding cards. The state is per viewer and per card, so a chart someone
// keeps closed stays closed across reloads; only the card that ships closed
// says so in the markup.
function initFolds(){
  document.querySelectorAll('h2[data-fold]').forEach(h => {
    const body = h.nextElementSibling;
    if(!body) return;
    const key = 'cc-cockpit.fold.' + h.dataset.fold;
    let open = h.dataset.foldDefault !== 'closed';
    try { const saved = localStorage.getItem(key); if(saved !== null) open = saved === '1'; }
    catch(e) {}
    h.classList.add('fold');
    h.setAttribute('role', 'button');
    h.tabIndex = 0;
    h.insertAdjacentHTML('afterbegin', '<span class="chev" aria-hidden="true">\u25B6</span>');
    const apply = () => { body.hidden = !open; h.setAttribute('aria-expanded', open); };
    const toggle = () => {
      open = !open;
      try { localStorage.setItem(key, open ? '1' : '0'); } catch(e) {}
      apply();
    };
    apply();
    h.addEventListener('click', toggle);
    h.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
    });
  });
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch(e) { return false; }
}
function color(pct, th){
  if(pct==null) return 'var(--blue)';
  if(pct>=th.critical) return 'var(--crit)';
  if(pct>=th.warn) return 'var(--warn)';
  return 'var(--ok)';
}
function ring(pct, col){
  const p = Math.max(0, Math.min(100, pct==null?0:pct));
  const R=30, C=2*Math.PI*R;
  return `<svg width="76" height="76" viewBox="0 0 76 76">
    <circle cx="38" cy="38" r="${R}" fill="none" stroke="var(--panel2)" stroke-width="8"/>
    <circle cx="38" cy="38" r="${R}" fill="none" stroke="${col}" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"
      transform="rotate(-90 38 38)"/>
    <text x="38" y="42" text-anchor="middle" fill="var(--fg)" font-size="15"
      font-weight="650">${pct==null?'—':Math.round(p)+'%'}</text></svg>`;
}
function bars(items, {value, label, height=110, fmt=money, hi=null}){
  if(!items.length) return `<div class="muted">${esc(t('no_data'))}</div>`;
  const max = Math.max(...items.map(value)) || 1;
  const w = 100/items.length;
  const cells = items.map((it,i)=>{
    const v = value(it), h = Math.max(2, v/max*height);
    const c = hi && hi(it) ? 'var(--accent)' : 'var(--blue)';
    return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;
      align-items:center;gap:5px" title="${label(it)}: ${fmt(v)}">
      <div style="width:100%;max-width:26px;height:${h}px;background:${c};border-radius:3px 3px 0 0;opacity:.9"></div>
      </div>`;}).join('');
  const ticks = items.map((it,i)=>{
    const show = items.length<=12 || i%Math.ceil(items.length/10)===0;
    return `<div style="flex:1;text-align:center;font-size:10px;color:var(--muted);
      white-space:nowrap">${show?label(it):''}</div>`;}).join('');
  return `<div style="display:flex;align-items:flex-end;gap:3px;height:${height}px">${cells}</div>
          <div style="display:flex;gap:3px;margin-top:6px">${ticks}</div>`;
}
// The official series is sparse by nature - a sample lands only while a CLI is
// rendering - and it restarts at zero whenever its window resets. Joining across
// a reset would draw a fall that never happened, so the line breaks there, and
// on any gap long enough to mean nothing was running.
function series(rows, key, resetKey, colour, box){
  const {x0, x1, W, H} = box;
  const px = t => (t - x0) / Math.max(1, x1 - x0) * W;
  const py = v => H - v / 100 * H;
  const segs = []; let cur = [], win = null, last = null;
  for (const r of rows){
    if (r[key] == null) continue;
    const broke = r[resetKey] !== win || (last !== null && r.at - last > 3 * 3600);
    if (broke && cur.length){ segs.push(cur); cur = []; }
    win = r[resetKey]; last = r.at; cur.push(r);
  }
  if (cur.length) segs.push(cur);
  return segs.map(seg => {
    const pts = seg.map(r => `${px(r.at).toFixed(1)},${py(r[key]).toFixed(1)}`).join(' ');
    return seg.length === 1
      ? `<circle cx="${px(seg[0].at).toFixed(1)}" cy="${py(seg[0][key]).toFixed(1)}" r="2" fill="${colour}"/>`
      : `<polyline points="${pts}" fill="none" stroke="${colour}" stroke-width="2"
           stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');
}

function officialChart(rows){
  if (!rows.length) return `<div class="muted">${esc(t('no_official_yet'))}</div>`;
  // the left gutter has to fit "100%" at the axis font size; 26 clipped it to "00%"
  const W = 1000, H = 150, pad = 38;
  const x0 = rows[0].at, x1 = Math.max(rows[rows.length-1].at, Date.now()/1000);
  const box = {x0, x1, W, H};
  const grid = [0, 50, 100].map(v => {
    const y = (H - v/100*H).toFixed(1);
    return `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
            <text x="-6" y="${(+y+3).toFixed(1)}" text-anchor="end" class="lbl">${v}%</text>`;
  }).join('');
  const days = [];
  for (let t = Math.ceil(x0/86400)*86400; t <= x1; t += 86400){
    const x = ((t - x0)/Math.max(1, x1-x0)*W).toFixed(1);
    days.push(`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--line)" stroke-dasharray="2 4"/>
      <text x="${x}" y="${H+14}" text-anchor="middle" class="lbl">${
        new Date(t*1000).toLocaleDateString(LOCALE, {day:'2-digit', month:'2-digit'})}</text>`);
  }
  const legend = [['block','var(--accent)',t('block_of',{h:'5'})],
                  ['week','var(--blue)', t('days7')]]
    .map(([k,c,l]) => `<span class="dot" style="background:${c}"></span>${esc(l)}`).join('  ');
  return `<div style="overflow-x:auto"><svg viewBox="${-pad} ${-8} ${W+pad*2} ${H+30}" style="width:100%;min-width:520px">
      ${grid}${days.join('')}
      ${series(rows, 'week', 'week_resets_at', 'var(--blue)', box)}
      ${series(rows, 'block', 'block_resets_at', 'var(--accent)', box)}
    </svg></div>
    <div class="note">${legend}</div>`;
}

function heatmap(hm){
  if (!hm || !hm.peak) return `<div class="muted">${esc(t('no_data'))}</div>`;
  // a Monday, so the weekday names come from the viewer's locale
  const monday = new Date(Date.UTC(2024, 0, 1));
  const cells = [];
  for (let d = 0; d < 7; d++){
    const name = new Date(monday.getTime() + d*86400000)
      .toLocaleDateString(LOCALE, {weekday:'short', timeZone:'UTC'});
    cells.push(`<div class="lbl-y">${esc(name)}</div>`);
    for (let h = 0; h < 24; h++){
      const v = hm.grid[d][h];
      const a = v ? (0.12 + 0.88 * Math.sqrt(v / hm.peak)).toFixed(3) : 0;
      cells.push(`<i style="opacity:${a}" title="${esc(name)} ${String(h).padStart(2,'0')}h · ${money(v)}"></i>`);
    }
  }
  cells.push('<div></div>');
  for (let h = 0; h < 24; h++)
    cells.push(`<div class="lbl-x">${h % 3 === 0 ? String(h).padStart(2,'0') : ''}</div>`);
  return `<div style="overflow-x:auto"><div class="heat" style="min-width:520px">${cells.join('')}</div></div>`;
}

// Yesterday is the only comparison a usage panel is really asked for, and it was
// already being computed and thrown away.
function yesterday(tt){
  const y = tt.yesterday.usd, today = tt.today.usd;
  if (!y) return '';
  const pct = (today - y) / y * 100;
  if (Math.abs(pct) < 1) return `<div class="delta muted">${esc(t('same_as_yesterday'))}</div>`;
  const up = pct > 0;
  const col = up ? 'var(--warn)' : 'var(--ok)';
  const text = t('vs_yesterday', {v: (up ? '▲ ' : '▼ ') + Math.abs(pct).toFixed(0) + '%'});
  return `<div class="delta" style="color:${col}" title="${esc(money(y))}">${esc(text)}</div>`;
}

function stacked(b){
  const parts = [
    ['cache read', b.cache_read, 'var(--blue)'],
    ['cache write 1h', b.cache_write_1h, 'var(--accent)'],
    ['cache write 5m', b.cache_write_5m, '#8a6bd9'],
    ['output', b.output, 'var(--ok)'],
    ['input', b.input, 'var(--warn)'],
  ].filter(p=>p[1]>0);
  const tot = parts.reduce((a,p)=>a+p[1],0)||1;
  return `<div style="display:flex;height:26px;border-radius:7px;overflow:hidden;margin-bottom:12px">
    ${parts.map(p=>`<div style="width:${p[1]/tot*100}%;background:${p[2]}" title="${p[0]}: ${toks(p[1])}"></div>`).join('')}
   </div>` +
   parts.map(p=>`<div style="display:flex;align-items:center;font-size:12.5px;padding:3px 0">
      <span class="dot" style="background:${p[2]}"></span>${p[0]}
      <span class="right mono">${toks(p[1])} · ${(p[1]/tot*100).toFixed(1)}%</span></div>`).join('');
}

// Which account the page is showing. Kept in localStorage so a refresh, or the
// tray opening the dashboard again, lands on the tab you were last reading.
let ACCOUNTS = null, CURRENT = null, PROJ_SCOPE = 'all';
try { PROJ_SCOPE = localStorage.getItem('cc-cockpit.projects') || 'all'; } catch(e) {}
try { CURRENT = localStorage.getItem('cc-cockpit.account'); } catch(e) {}

function pickAccount(id){
  CURRENT = id;
  try { localStorage.setItem('cc-cockpit.account', id); } catch(e) {}
  safeTick();
}

function drawTabs(){
  const box = $('#tabs');
  if(!ACCOUNTS || !ACCOUNTS.multi){ box.hidden = true; return; }
  box.hidden = false;
  const items = ACCOUNTS.accounts.map(a => [a.id, a.label, a.exists])
    .concat([[ACCOUNTS.all_id, t('all_accounts'), true]]);
  box.innerHTML = items.map(([id,label,ok]) =>
    `<button role="tab" data-id="${esc(id)}" aria-selected="${id===CURRENT}">${esc(label)}${
      ok ? '' : `<span class="miss" title="${esc(t('acct_missing'))}">!</span>`}</button>`).join('');
  box.querySelectorAll('button').forEach(el =>
    el.onclick = () => pickAccount(el.dataset.id));
}

// Rings for every account, side by side. The combined tab uses this instead of
// one ring: adding percentages from two subscriptions would invent a number,
// since each window has its own ceiling and its own reset.
function perAccountGauges(list, th){
  return `<div class="split">` + list.map(g => {
    const d = g.block;
    return `<div class="mini">${ring(d.pct, color(d.pct, th))}
      <div><div class="who">${esc(g.label)}</div>
        <div class="amt">${money(d.usd)}</div>
        <div class="amt">${d.remaining_s ? esc(t('resets_in',{d:dur(d.remaining_s)})) : ''}</div>
      </div></div>`; }).join('') + `</div>`;
}

async function tick(){
  if(!ACCOUNTS){
    ACCOUNTS = await (await fetch('/api/accounts')).json();
    const known = ACCOUNTS.accounts.map(a=>a.id).concat([ACCOUNTS.all_id]);
    if(!CURRENT || !known.includes(CURRENT)) CURRENT = ACCOUNTS.primary;
  }
  const qs = CURRENT ? ('?account=' + encodeURIComponent(CURRENT)) : '';
  const [s, official] = await Promise.all([
    (await fetch('/api/summary' + qs)).json(),
    fetch('/api/history' + qs).then(r => r.ok ? r.json() : []).catch(() => []),
  ]);
  T = s.i18n.catalog; LOCALE = s.i18n.tag; LOCAL = s.local_currency;
  document.documentElement.lang = s.i18n.language;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('#h-blocks').textContent = t('card_blocks', {h: s.block_hours.toFixed(0)});
  const th = {warn:s.thresholds.warn, critical:s.thresholds.critical};
  const b = s.block, w = s.week, tt = s.totals;

  $('#plan').innerHTML = s.plan.monthly_usd
    ? esc(t('plan_roi', {name: s.plan.name||'—', roi: s.plan.roi||0}))
    : `${esc(t('month_equivalent'))} <b>${money(tt.month.usd)}</b>${local(tt.month.usd)}`;
  $('#live').textContent = t('sessions_open', {n: s.sessions.length});

  // the login is per account; the combined tab carries one per account instead
  const logins = s.login ? [{label: null, login: s.login}]
    : (s.per_account || []).filter(g => g.login).map(g => ({label: g.label, login: g.login}));
  const pill = $('#login');
  pill.hidden = !logins.length;
  pill.innerHTML = logins.map(({label, login}) => {
    const text = login.expired ? t('login_expired')
      : t('login_expires', {d: dur(login.remaining_s)});
    const col = {ok:'var(--muted)', warn:'var(--warn)', crit:'var(--crit)'}[login.state];
    return `<span style="color:${col}">${label ? esc(label) + ': ' : ''}${esc(text)}</span>`;
  }).join(' · ');
  $('#upd').textContent = t('updated',
    {time: new Date(s.generated_at*1000).toLocaleTimeString(LOCALE)});
  // which build is answering: the page and the payload come from the same
  // process, so this is the version actually serving the dashboard
  $('#ver').textContent = 'v' + s.version;

  drawTabs();

  if(b.window_source === 'combined' && s.per_account){
    $('#gauges').innerHTML = `<div class="card" style="grid-column:1/-1">
      <h2>${esc(t('block_of',{h:s.block_hours.toFixed(0)}))}</h2>
      ${perAccountGauges(s.per_account, th)}
      <div class="note">${esc(t('combined_note'))}</div></div>`
      + [[t('today'), s.today_gauge,
          `${tt.today.requests} ${t('requests')} · ${tt.today.sessions} ${t('sessions')}`],
         [t('month'), {...tt.month, pct:null, limit:null},
          `${nf().format(tt.month.requests)} ${t('requests')}`]]
        .map(([title,d,cap])=>`
          <div class="card"><h2>${esc(title)}</h2><div class="gauge">
            ${ring(d.pct, color(d.pct, th))}
            <div><div class="num">${money(d.usd)}<span class="muted" style="font-size:13px;font-weight:400">${local(d.usd)}</span></div>
              <div class="cap">${toks(d.tokens)} tokens · ${esc(cap)}</div>
            </div></div></div>`).join('');
  } else
  $('#gauges').innerHTML = [
    [t('block_of',{h:s.block_hours.toFixed(0)}), b,
      b.remaining_s ? t('resets_in',{d:dur(b.remaining_s)}) : t('no_activity')],
    [w.window_source==='anchored' ? t('week_window') : t('days7'), w,
      w.remaining_s ? t('resets_in',{d:dur(w.remaining_s)})
                    : `${nf().format(w.requests)} ${t('requests')}`],
    [t('today'), s.today_gauge,
      `${tt.today.requests} ${t('requests')} · ${tt.today.sessions} ${t('sessions')}`, yesterday(tt)],
  ].map(([title,d,cap,extra])=>`
    <div class="card"><h2>${title}</h2><div class="gauge">
      ${ring(d.pct, color(d.pct, th))}
      <div><div class="num">${money(d.usd)}<span class="muted" style="font-size:13px;font-weight:400">${local(d.usd)}</span></div>
        <div class="cap">${toks(d.tokens)} tokens · ${esc(cap)}</div>
        ${extra || ''}
        ${d.limit?`<div class="cap">${esc(t('reference_ceiling',{v:money(d.limit)}))}${
          d.limit_error?' ±'+(d.limit_error*100).toFixed(0)+'%':''}${
          d.limit_source?' · '+esc(t('src_'+d.limit_source)):''}${
          d.limit_samples>1?' · '+esc(t('readings',{n:d.limit_samples})):''}</div>`:''}
      </div></div></div>`).join('');

  // an open window with nothing spent in it makes pace and projection zero;
  // a dash says "nothing yet", where "$0.00/h" reads like a measurement
  const spent = b.requests > 0;
  $('#kpis').innerHTML = [
    [spent?money(b.burn_usd_per_h)+'/h':'—', t('kpi_pace')],
    [(spent && b.active)?money(b.projected_usd):'—', t('kpi_projection')],
    [(spent && b.eta_limit_s!=null && b.active)?dur(b.eta_limit_s):'—', t('kpi_eta')],
    [tt.last_7d.cache_hit_pct+'%', t('kpi_cache')],
  ].map(([v,l])=>`<div class="card kpi"><div class="v mono">${v}</div><div class="l">${esc(l)}</div></div>`).join('');

  $('#official').innerHTML = officialChart(official);
  $('#heatmap').innerHTML = heatmap(s.heatmap);
  $('#heat-note').textContent = s.heatmap
    ? '· ' + t('heatmap_weeks', {n: s.heatmap.weeks}) : '';

  $('#daily').innerHTML = bars(s.daily.slice(-30), {
    value:d=>d.usd, label:d=>d.date.slice(8)+'/'+d.date.slice(5,7),
    hi:d=>d.date===new Date().toISOString().slice(0,10)});

  $('#hourly').innerHTML = bars(s.hourly_24h, {
    value:h=>h.usd, height:90,
    label:h=>String(new Date(h.hour*1000).getHours()).padStart(2,'0')+'h'});

  $('#sessions').innerHTML = s.sessions.length ? s.sessions.map(x=>`
    <div class="sess ${x.status}">
      <div style="min-width:0">
        <div class="nm"><span class="dot" style="background:${x.status==='busy'?'var(--ok)':'var(--muted)'}"></span>${esc(x.name)}
          <span class="tag">${x.status}</span>${
          ACCOUNTS && ACCOUNTS.multi ? `<span class="tag">${esc(x.account_label||x.account)}</span>` : ''}</div>
        <div class="pth">${esc(x.cwd)}</div>
      </div>
      <div class="right"><div class="mono">${money(x.usage.usd)}</div>
        <div class="muted" style="font-size:11.5px">${
          (x.context && x.context.context_pct != null)
            ? 'ctx ' + x.context.context_pct.toFixed(0) + '% · ' : ''
        }${toks(x.usage.tokens)} · ${dur(x.uptime_s)} · pid ${x.pid}</div></div>
    </div>`).join('') : `<div class="muted">${esc(t('no_sessions'))}</div>`;

  // the browser cannot open a terminal, so what it offers is the line that
  // reopens the conversation - the session id is the part nothing else knows
  const recent = s.recent || [];
  $('#recent-card').hidden = !s.recent_limit;      // 0 means the user turned it off
  $('#recent-note').textContent = recent.length ? '· ' + recent.length : '';
  $('#recent').innerHTML = recent.length ? recent.map(x=>{
    const cmd = `cd ${x.cwd} && claude --resume ${x.session_id}`;
    return `<div class="sess">
      <div style="min-width:0">
        <div class="nm">${esc(x.title || t('untitled'))}</div>
        <div class="pth">${esc(x.project)} · ${esc(t('ago', {d: dur(x.ago_s)}))}${
          ACCOUNTS && ACCOUNTS.multi ? ' · ' + esc(x.account_label||x.account) : ''}</div>
        <button class="cmd" data-cmd="${esc(cmd)}" title="${esc(t('copy_resume'))}"
          >claude --resume ${esc(x.session_id.slice(0,8))}…</button>
      </div>
      <div class="right"><div class="mono">${money(x.usage.usd)}</div>
        <div class="muted" style="font-size:11.5px">${toks(x.usage.tokens)} · ${
          nf().format(x.usage.requests)} ${t('th_req')}</div></div>
    </div>`;
  }).join('') : `<div class="muted">${esc(t('no_recent'))}</div>`;
  $('#recent').querySelectorAll('button.cmd').forEach(el => el.onclick = async () => {
    if(await copy(el.dataset.cmd)){
      const was = el.innerHTML;
      el.textContent = t('copied');
      setTimeout(() => { el.innerHTML = was; }, 1600);
      return;
    }
    // nothing to write the clipboard with: show the whole line and select it,
    // so the keyboard can still take it
    el.textContent = el.dataset.cmd;
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });

  $('#proj-scope').innerHTML = [['today', t('scope_today')], ['all', t('scope_all')]]
    .map(([k,l]) => `<button data-scope="${k}" aria-pressed="${k===PROJ_SCOPE}">${esc(l)}</button>`).join('');
  $('#proj-scope').querySelectorAll('button').forEach(el => el.onclick = () => {
    PROJ_SCOPE = el.dataset.scope;
    try { localStorage.setItem('cc-cockpit.projects', PROJ_SCOPE); } catch(e) {}
    safeTick();
  });
  const plist = PROJ_SCOPE === 'today' ? (s.projects_today || []) : s.projects;
  const pmax = Math.max(...plist.map(p=>p.usd), 1);
  // the share is of everything spent, which the bar cannot say: the bar is
  // relative to the biggest project, so a table of small ones would all look full
  const psum = plist.reduce((a,p)=>a+p.usd, 0) || 1;
  $('#projects').innerHTML = `<tr><th>${esc(t('th_project'))}</th>
      <th class="r">${esc(t('th_tokens'))}</th><th class="r">${esc(t('th_req'))}</th>
      <th class="r">${esc(t('sessions'))}</th><th class="r">${esc(t('th_last'))}</th>
      <th class="r">USD</th><th style="width:26%"></th></tr>` +
    (plist.length ? plist : []).slice(0,12).map(p=>`<tr>
      <td title="${esc(p.cwd)}">${esc(p.label)}</td>
      <td class="r mono muted">${toks(p.tokens)}</td>
      <td class="r mono muted">${nf().format(p.requests)}</td>
      <td class="r mono muted">${nf().format(p.sessions)}</td>
      <td class="r mono muted">${p.last ? t('ago', {d: dur(s.generated_at - p.last)}) : '—'}</td>
      <td class="r mono">${money(p.usd)}
        <span class="muted">${(p.usd/psum*100).toFixed(0)}%</span></td>
      <td><div class="bar"><i style="width:${p.usd/pmax*100}%"></i></div></td></tr>`).join('');

  // the card runs the full width now: the room goes into more history rather
  // than into gaps between the same fourteen bars
  $('#blocks').innerHTML = bars(s.blocks.slice(-28), {
    value:x=>x.usd, height:90,
    label:x=>{const d=new Date(x.start*1000);
      return String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+'h';},
    hi:x=>x.end*1000>Date.now()});

  const mtot = s.models.reduce((a,m)=>a+m.usd,0)||1;
  $('#models').innerHTML = `<tr><th>${esc(t('th_model'))}</th><th class="r">${esc(t('th_req'))}</th><th class="r">USD</th></tr>` +
    s.models.map(m=>`<tr><td>${esc(m.model)}</td><td class="r mono muted">${nf().format(m.requests)}</td>
      <td class="r mono">${money(m.usd)} <span class="muted">${(m.usd/mtot*100).toFixed(0)}%</span></td></tr>`).join('');

  $('#tokmix').innerHTML = stacked(tt.last_7d);

  const ef = Object.entries(s.efforts);
  const eftot = ef.reduce((a,[,v])=>a+v,0)||1;
  $('#misc').innerHTML = ef.map(([k,v])=>`<div style="display:flex;font-size:13px;padding:3px 0">
      <span>${esc(k)}</span><span class="right mono">${nf().format(v)} · ${(v/eftot*100).toFixed(0)}%</span></div>`).join('')
    + `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px">
       ${esc(t('subagents', {usd: money(s.subagents.usd), n: nf().format(s.subagents.requests)}))}</div>`;

  $('#foot').textContent = t('footer',
    {n: nf().format(tt.all.requests), tok: toks(tt.all.tokens), usd: money(tt.all.usd)});
}
async function safeTick(){
  try { await tick(); }
  catch (err) {
    // a silent throw used to leave the cards below it blank with no clue why
    console.error('[cc-cockpit]', err);
    $('#foot').textContent = 'render error: ' + err.message;
  }
}
initFolds();
safeTick(); setInterval(safeTick, 20000);
</script>
</body>
</html>
