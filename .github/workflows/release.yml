name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag must match cockpit.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import cockpit; print(cockpit.__version__)")
          test "$tag" = "$version" || { echo "tag $tag != version $version"; exit 1; }

      - run: python -m pip install --quiet build
      - run: python -m build
      - run: ./packaging/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing: no API token to store
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Keep only what PyPI accepts
        run: rm -f dist/*.deb
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
